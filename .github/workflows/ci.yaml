# Goal - I have to lint, build, Test the code for frontend & backend
# Then Push the image to DockerHub

name: CI

on:
    Push:
        branched: [advanced]

jobs:
    frontend:
        # Github Runner
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            
            - name: Setup NodeJs
              uses: actions/setup-nodev6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Install npm packages
              run: npm install

            - name: Run Linter 
              run:  npm run lint 

            - name: Run test 
              run: npm run test
            #- build
            #- Test
            #- Push
          
